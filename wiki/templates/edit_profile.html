
<!DOCTYPE html>
{% load static %}
<link rel="stylesheet" href="{% static 'wiki/profile_page.css' %}">
<link rel="stylesheet" href="{% static 'wiki/edit_profile.css' %}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'wiki/dark_mode.css' %}">
<script>
  // Prevent white flash - apply dark mode immediately before page renders
  (function() {
    const theme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>

<body>
  <div class="default_buttons d-flex justify-content-between align-items-center px-4">
    <a href="{% url 'wiki:profile' request.user.username %}" class="btn btn-primary">Back to Profile</a>
    <a href="{% url 'wiki:user-wiki' request.user.username %}" class="btn btn-primary">Back to Stream</a>
  </div>
  <div style="height:5.5em"></div>
  <div class="container mt-4">
    <form method="post" action="{% url 'wiki:edit_profile' request.user.username%}" enctype="multipart/form-data">
        {% csrf_token %}
        <section class="author_profile_card">
            <section class="author_profile">
                {% if author.profileImage %}
                    <img class="profile_image" src="{{ author.profileImage }}" alt="Profile image">
                {% else %}
                    <img class="profile_image" src="https://cdn.pixabay.com/photo/2016/08/08/09/17/avatar-1577909_640.png" alt="Default image">
                {% endif %}

                <label for="profileImage">Profile Image URL:</label>
                <input type="url" id="profileImage" name="profileImage" value="{{ author.profileImage|default_if_none:'' }}" placeholder="https://example.com/your-image.jpg" class="editable_input" />

                <label for="displayName">Display Name:</label>
                <input type="text" id="displayName" name="displayName" value="{{ author.displayName }}" class="editable_input" required />

                <label for="description">Description:</label>
                <textarea id="description" name="description" class="editable_input">{% if author.description %}{{ author.description }}{% endif %}</textarea>

                <label for="github">GitHub URL:</label>
                <input type="url" id="github" name="github" value="{{ author.github|default_if_none:'' }}" class="editable_input" placeholder="https://github.com/username" />
                <small id="github_error" class="error-message" style="display: none; color: red;"></small>
                <small id="github_valid" style="display: none; color: green;">✓ Valid GitHub URL</small>

                <button class="save_button" type="submit">Save Changes</button>

                {% if error %}
                <p class="error-message">{{ error }}</p>
                {% endif %}
            </section>
        </section>
    </form>
  </div>

  <script>
    // GitHub URL validation
    const githubInput = document.getElementById('github');
    const githubError = document.getElementById('github_error');
    const githubValid = document.getElementById('github_valid');
    let validationTimeout;

    function validateGitHubURL(url) {
      // Allow empty URL (optional field)
      if (!url || url.trim() === '') {
        githubError.style.display = 'none';
        githubValid.style.display = 'none';
        return true;
      }

      // Check URL format
      const githubPattern = /^https?:\/\/(www\.)?github\.com\/[a-zA-Z0-9]([a-zA-Z0-9]|-(?!-)){0,38}(?<![.-])\/?$/;
      
      if (!githubPattern.test(url)) {
        githubError.textContent = 'Invalid GitHub URL format. Use: https://github.com/username';
        githubError.style.display = 'block';
        githubValid.style.display = 'none';
        return false;
      }

      // Extract username
      let cleanUrl = url.trim();
      if (cleanUrl[cleanUrl.length - 1] === '/') {
        cleanUrl = cleanUrl.slice(0, -1);
      }
      const username = cleanUrl.substring(cleanUrl.lastIndexOf('/') + 1);

      // Check if username is valid length
      if (!username || username.length > 39) {
        githubError.textContent = 'Invalid GitHub username format';
        githubError.style.display = 'block';
        githubValid.style.display = 'none';
        return false;
      }

      // Validate account exists via GitHub API
      githubError.style.display = 'none';
      githubValid.style.display = 'none';
      
      fetch(`https://api.github.com/users/${username}`, {
        method: 'GET',
        headers: {
          'Accept': 'application/json'
        }
      })
      .then(response => {
        if (response.status === 200) {
          githubValid.style.display = 'block';
          githubError.style.display = 'none';
          return true;
        } else if (response.status === 404) {
          githubError.textContent = `GitHub account '${username}' does not exist. Please check the username.`;
          githubError.style.display = 'block';
          githubValid.style.display = 'none';
          return false;
        } else {
          // API error (rate limit, etc.) - format is correct, so allow it
          githubValid.style.display = 'block';
          githubError.style.display = 'none';
          return true;
        }
      })
      .catch(error => {
        // Network error - format is correct, so allow it
        githubValid.style.display = 'block';
        githubError.style.display = 'none';
        return true;
      });

      return true;
    }

    // Debounced validation
    githubInput.addEventListener('input', function() {
      clearTimeout(validationTimeout);
      validationTimeout = setTimeout(() => {
        validateGitHubURL(this.value);
      }, 500); // Wait 500ms after user stops typing
    });

    // Validate on form submit
    document.querySelector('form').addEventListener('submit', function(e) {
      const url = githubInput.value;
      if (url && url.trim() !== '') {
        // Basic format check before submit
        const githubPattern = /^https?:\/\/(www\.)?github\.com\/[a-zA-Z0-9]([a-zA-Z0-9]|-(?!-)){0,38}(?<![.-])\/?$/;
        if (!githubPattern.test(url)) {
          e.preventDefault();
          githubError.textContent = 'Invalid GitHub URL format. Please fix before submitting.';
          githubError.style.display = 'block';
          githubValid.style.display = 'none';
          githubInput.focus();
        }
      }
    });
  </script>
<!-- Dark Mode Toggle -->
<script src="{% static 'js/dark_mode.js' %}"></script>
</body>
