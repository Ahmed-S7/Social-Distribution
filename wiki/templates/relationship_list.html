{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ title }}</title>
  <script>
    // Prevent white flash - apply dark mode IMMEDIATELY before anything renders
    try {
      const theme = localStorage.getItem('theme') || 'light';
      const html = document.documentElement;
      html.setAttribute('data-theme', theme);
      // Apply background color immediately to prevent white flash
      html.style.backgroundColor = theme === 'dark' ? '#252525' : '#f9f9f9';
    } catch(e) {}
  </script>
  <style>
    /* Prevent white flash - apply background color immediately */
    html { 
      background-color: #f9f9f9; /* Default light mode */
      min-height: 100%;
    }
    html[data-theme="dark"] {
      background-color: #252525 !important;
    }
    body {
      background-color: #f9f9f9; /* Default light mode */
      margin: 0;
      padding: 0;
    }
    html[data-theme="dark"] body {
      background-color: #252525 !important;
    }
  </style>
  <link rel="stylesheet" href="{% static 'wiki/profile_page.css' %}">
  <link rel="stylesheet" href="{% static 'wiki/dark_mode.css' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
  </style>
</head>
<body>
  <div class="default_buttons d-flex justify-content-between align-items-center px-4">
    <a href="{% url 'wiki:profile' request.user.username %}" class="btn btn-primary">Back to Profile</a>
    <a href="{% url 'wiki:user-wiki' request.user.username %}" class="btn btn-primary">Back to Stream</a>
  </div>
 <h2 class='page_title'>{{ title }}</h2>
  <div class="author_list">

    <link rel="stylesheet" href="{% static 'wiki/author_list.css' %}">
    <section class="authors_list">
    {% if people %}
      <ul class="author_list">
        {% for person in people %}
          <li class="author">  
              <a href="{% url 'wiki:view_external_profile' person.serial %}">
                {% if person.profileImage %}
                  <img class="profile_image" src="{{ person.profileImage }}" alt="Profile Picture">
                {% else %}
                  <img class="profile_image" src="https://cdn.pixabay.com/photo/2016/08/08/09/17/avatar-1577909_640.png" alt="Default image">
                {% endif %}
              </a>
            <p class="list_display_name">{{ person.displayName }}</p>
            <section class="view_profile_button">
              <a href="{% url 'wiki:view_external_profile' person.serial %}">
                <button class="view_profile" type="submit">View Profile</button>
              </a>
            </section>
          </li>
        {% endfor %}
      </ul>
    {% else %}
        <p>No {{ title|lower }} found.</p>
    {% endif %}
    </section>
  </div>

  <!-- Dark Mode Toggle -->
  <script src="{% static 'js/dark_mode.js' %}"></script>
</body>
</html>
